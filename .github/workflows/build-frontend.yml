name: Build React frontend assets

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "worker/package.json"
      - "worker/vite.config.ts"
      - "package.json"
      - ".github/workflows/build-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soyuz-react-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build production assets
        run: npm run build
      - name: Mirror Pages entrypoint to repository root
        run: |
          cp worker/assets/index.html index.html
          cp worker/assets/app.js app.js
          cp worker/assets/manifest.webmanifest manifest.webmanifest
          cp worker/assets/sw.js sw.js
          cp worker/assets/icon.svg icon.svg
          touch .nojekyll
      - name: Commit compiled assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A worker/assets index.html app.js manifest.webmanifest sw.js icon.svg .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Build React frontend assets"
            git push origin HEAD:main
          fi
