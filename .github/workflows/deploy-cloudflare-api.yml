name: Deploy Soyuz API to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soyuz-cloudflare-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "::error::Add repository secret CF_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Add repository secret CF_ACCOUNT_ID"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Deploy Worker and static assets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
