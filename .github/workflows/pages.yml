name: Deploy СОЮЗ to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "worker/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build single-file app
        run: npm run build
      - name: Prepare Pages artifact
        run: |
          mkdir -p pages-artifact
          cp worker/assets/index.html pages-artifact/index.html
          cp worker/assets/icon.svg pages-artifact/icon.svg
          cp worker/assets/manifest.webmanifest pages-artifact/manifest.webmanifest
          cp worker/assets/sw.js pages-artifact/sw.js
          cp worker/assets/app.js pages-artifact/app.js
          cp worker/assets/styles.css pages-artifact/styles.css
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
