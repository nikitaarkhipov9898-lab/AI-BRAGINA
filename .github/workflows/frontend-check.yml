name: Frontend build check

on:
  push:
    branches: [admin-panel, experimental-soyuz-system]
    paths:
      - "worker/frontend/**"
      - "worker/package.json"
      - ".github/workflows/frontend-check.yml"
  pull_request:
    branches: [admin-panel, experimental-soyuz-future]
    paths:
      - "worker/frontend/**"
      - "worker/package.json"
      - ".github/workflows/frontend-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/frontend/package.json
      - run: npm install
      - name: Dependency security audit
        run: |
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); console.log(JSON.stringify(a.vulnerabilities || {}, null, 2))'
          npm audit --audit-level=high
      - name: Build frontend with commit version\n        env:\n          VITE_APP_BUILD: ${{ github.sha }}\n        run: npm run build
      - name: Validate Worker runtime syntax
        run: node --check ../index.js
      - name: Verify Worker frontend asset bundle
        run: test -s ../assets/next/index.html
