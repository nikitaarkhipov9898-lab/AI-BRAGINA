name = "chef-api"
main = "index.js"
compatibility_date = "2026-11-22"

# Production D1 database.
[[d1_databases]]
binding = "DB"
database_name = "ai-bragina-db"
database_id = "8bb9c36e-a38a-4c79-86dc-cbaf92fce859"

# Preview deployments use a separate test database, never production data.
[previews]
[[previews.d1_databases]]
binding = "DB"
database_name = "ai-bragina-preview"
database_id = "3b45bec2-15ac-49c9-97fc-5c607657e7bc"

# Frontend files are packaged with the Worker; no runtime GitHub fetch is needed.
[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true
